name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Voice.Bot.Client.Net.sln

      - name: Build
        run: dotnet build Voice.Bot.Client.Net.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Voice.Bot.Client.Net.sln --configuration Release --no-build --logger "console;verbosity=normal"
