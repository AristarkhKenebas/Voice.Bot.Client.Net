name: Release to NuGet

# Triggered by pushing a version tag, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
# The leading "v" is stripped and used as the exact NuGet package version.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Requires a NUGET_API_KEY secret (repo or "nuget-publish" environment secret) with push
    # rights on nuget.org for the Voice.Bot.Client.Net package id. Add a required-reviewers rule
    # on the "nuget-publish" environment in repo Settings if you want a manual gate before publish.
    environment: nuget-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink needs full history to resolve commit metadata

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Voice.Bot.Client.Net.sln

      - name: Build
        run: >
          dotnet build Voice.Bot.Client.Net.sln
          --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Voice.Bot.Client.Net.sln --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack src/Voice.Bot.Client.Net/Voice.Bot.Client.Net.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
