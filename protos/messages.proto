syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common.proto";

option csharp_namespace = "Vc.Backend.WebApi.Messages.Grpc";

package messages;

service MessagesApi {
  rpc CreateMessage (CreateMessageRequest) returns (Message);
  rpc UpdateMessage (UpdateMessageRequest) returns (Message);
  rpc DeleteMessage (DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc GetChannelMessages (GetChannelMessagesRequest) returns (GetChannelMessagesResponse);
  rpc Typing (TypingRequest) returns (TypingResponse);
  rpc AddReaction (ReactionRequest) returns (Message);
  rpc RemoveReaction (ReactionRequest) returns (Message);
  rpc GetMessage (GetMessageRequest) returns (Message);
  rpc ForwardMessage (ForwardMessageRequest) returns (ForwardMessageResponse);
  rpc GetMessagesAround (GetMessagesAroundRequest) returns (GetMessagesAroundResponse);
  rpc SearchMessages (SearchMessagesRequest) returns (SearchMessagesResponse);
}

message Message {
  string id = 1;
  string channel_id = 2;
  common.User author = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool is_edited = 7;
  bool is_deleted = 8;
  string reply_to = 9;
  repeated Attachment attachments = 10;
  map<string, ReactionUsers> reactions = 11;
  // Set only when this message is a bot's response to a slash-command/component/modal interaction
  // (Discord-style "used /command" tag) - empty/unset for plain messages.
  optional string interaction_id = 12;
  optional string interaction_command_name = 13;
  optional string interaction_user_id = 14;
  // JSON ActionRow[] (buttons/select/combobox/checkbox) attached to this message, if any - see
  // docs/message-components.md.
  optional string components_json = 15;
  optional string forwarded_from = 16;
  // Users/bots/agents and channels referenced by `<@id>` / `<#id>` tokens in `content`, resolved by
  // the server so a client can render them without having the member or channel loaded.
  repeated MentionedUser mentions = 17;
  repeated MentionedChannel mention_channels = 18;
  // Roles mentioned as `<@&id>`, @everyone / @here - set only when the author was allowed to
  // mention them (MentionEveryone, or a mentionable role); otherwise the token stays plain text.
  repeated MentionedRole mention_roles = 19;
  bool mention_everyone = 20;
  bool mention_here = 21;
  // Author of the reply_to message, "" when this isn't a reply.
  string reply_to_author_id = 22;
}

message MentionedRole {
  string id = 1;
  string name = 2;
  int32 color = 3;
}

message MentionedUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  bool is_bot = 5;
}

message MentionedChannel {
  string id = 1;
  string name = 2;
  int32 type = 3;
  string group_id = 4;
}

message ReactionUsers {
  repeated string user_ids = 1;
}

message Attachment {
  string id = 1;
  string uploader_id = 2;
  string file_name = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  string status = 6;
  string download_url = 7;
}

message CreateMessageRequest {
  string channel_id = 1;
  string content = 2;
  string reply_to = 3;
  repeated string attachment_ids = 4;
}

message UpdateMessageRequest {
  string id = 1;
  string content = 2;
}

message DeleteMessageRequest {
  string id = 1;
}

message DeleteMessageResponse {
  string id = 1;
  bool success = 2;
}

message GetChannelMessagesRequest {
  string channel_id = 1;
  int32 limit = 2;
  string before_id = 3;
}

message GetChannelMessagesResponse {
  repeated Message messages = 1;
}

message TypingRequest {
  string channel_id = 1;
  bool is_typing = 2;
}

message TypingResponse {
  bool success = 1;
}

message ReactionRequest {
  string message_id = 1;
  string emoji = 2;
}

message GetMessageRequest {
  string message_id = 1;
}

message ForwardMessageRequest {
  string source_message_id = 1;
  repeated string destination_channel_ids = 2;
  string idempotency_key = 3;
}

message ForwardMessageResult {
  string channel_id = 1;
  bool success = 2;
  string error_message = 3;
  Message message = 4;
}

message ForwardMessageResponse {
  repeated ForwardMessageResult results = 1;
}

// Jump-to-message: returns up to `before` messages strictly older than `message_id`, the target
// message itself (if it exists in `channel_id` and isn't deleted), and up to `after` messages
// strictly newer than it - all sorted ascending (oldest first), same ordering as
// GetChannelMessagesResponse. `target_found = false` means the message doesn't exist, isn't in
// this channel, or was deleted - the rest of `messages` (if any) is still valid context.
message GetMessagesAroundRequest {
  string channel_id = 1;
  string message_id = 2;
  int32 before = 3;
  int32 after = 4;
}

message GetMessagesAroundResponse {
  repeated Message messages = 1;
  bool target_found = 2;
}

enum SearchMessagesSort {
  SEARCH_MESSAGES_SORT_RELEVANCE = 0;
  SEARCH_MESSAGES_SORT_NEWEST = 1;
  SEARCH_MESSAGES_SORT_OLDEST = 2;
}

enum SearchMessagesHas {
  SEARCH_MESSAGES_HAS_UNSPECIFIED = 0;
  SEARCH_MESSAGES_HAS_ATTACHMENT = 1; // any attachment
  SEARCH_MESSAGES_HAS_IMAGE = 2;
  SEARCH_MESSAGES_HAS_VIDEO = 3;
  SEARCH_MESSAGES_HAS_FILE = 4;       // attachment that is neither image nor video
  SEARCH_MESSAGES_HAS_LINK = 5;       // content contains an http(s) link
}

message SearchMessagesRequest {
  string group_id = 1;
  // Free text. May be empty when at least one filter is set (then it's a filter-only search, sorted by date).
  string query = 2;
  repeated string channel_ids = 3;   // "in:" — limited further to what the caller may view
  repeated string author_ids = 4;    // "from:"
  repeated SearchMessagesHas has = 5; // all must hold
  string before = 6;                 // ISO-8601 instant or date, exclusive; empty = none
  string after = 7;                  // ISO-8601 instant or date, inclusive; empty = none
  SearchMessagesSort sort = 8;
  int32 page_size = 9;               // default 25, max 50
  string page_token = 10;            // opaque; empty = first page
}

message SearchMessagesResponse {
  repeated SearchMessageHit hits = 1;
  int64 total = 2;                   // total matches (exact up to 10000, then a lower bound)
  string next_page_token = 3;        // empty on the last page
}

message SearchMessageHit {
  Message message = 1;
  // Fragments of message.content around the matches, each match wrapped in U+E000 … U+E001.
  // Empty for filter-only searches.
  repeated string highlights = 2;
}
