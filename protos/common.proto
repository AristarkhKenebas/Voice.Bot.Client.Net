syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Vc.Backend.Contracts.Grpc";

package common;

enum UserStatus {
  ONLINE = 0;
  OFFLINE = 1;
  DO_NOT_DISTURB = 2;
  INVISIBLE = 3;
}

enum BotType {
  BOT = 0;
  AGENT = 1;
}

enum AiProviders {
  OPENAI = 0;
  ANTHROPIC = 1;
  GOOGLE = 2;
  DEEPSEEK = 3;
  MISTRAL = 4;
  KIMI = 5;
  MIMO = 6;
}

// Discord/Claude-style "what the bot is doing right now" reactive status, distinct from the plain
// on/off UserTyping - see BotsApi.SetTyping.
enum BotTypingState {
  THINKING = 0;
  EXPLORED = 1;
  PROCESSING = 2;
  REVIEWED = 3;
  OPENED = 4;
  RE_SEARCH = 5;
  FETCHED = 6;
}

message User {
  string id = 1;
  string username = 2;
  // Confidential: populated only when this User is the requester's own profile; empty otherwise.
  string email = 3;
  string display_name = 4;
  string description = 5;
  string status = 6;
  string preferred_language = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp last_activity = 10;
  bool is_confirmed = 11;
  bool is_bot = 12;
  Subscription subscription = 13;
  string avatar_url = 14;
  string banner_url = 15;
  UserStatus user_status = 16;
}

// A user currently connected to a voice channel, with their live LiveKit A/V state - see
// Vc.Backend.WebApi.Channels.Services.ChannelHiddenParticipantService, which observes the room as a
// hidden participant to keep this in sync (mic/cam reflect published track mute state, is_deafened
// reflects the client-set `deafened` participant attribute).
message ChannelVoiceUser {
  common.User user = 1;
  bool mic_is_enabled = 2;
  bool cam_is_enabled = 3;
  bool is_deafened = 4;
}

message Bot {
  string id = 1;
  string owner_id = 2;
  string username = 3;
  string display_name = 4;
  string description = 5;
  string avatar_id = 6;
  common.UserStatus user_status = 7;
  common.BotType type = 8;
  bool is_enabled = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Discord-style Gateway Intents bitmask granted to the bot by its owner — see
  // Vc.Common.Types.BotIntents. Replaces the old string-set "scopes".
  uint64 intents = 12;
  string avatar_url = 13;
}

message AgentCredential {
  common.AiProviders provider = 1;
  string model_name = 2;
  optional string organization_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
}

message Subscription {
  string id = 1;
  string tier_code = 2;
  int64 functions = 3;
  optional string activated_at = 4;
  optional string expires_at = 5;
}
