syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Vc.Backend.WebApi.Attachments.Grpc";

package attachments;

service AttachmentsApi {
  rpc InitiateUpload (InitiateUploadRequest) returns (InitiateUploadResponse);
  rpc ConfirmUpload (ConfirmUploadRequest) returns (AttachmentResponse);

  rpc InitiateMultipartUpload (InitiateMultipartUploadRequest) returns (InitiateMultipartUploadResponse);
  rpc GetMultipartPartUrls (GetMultipartPartUrlsRequest) returns (GetMultipartPartUrlsResponse);
  rpc CompleteMultipartUpload (CompleteMultipartUploadRequest) returns (AttachmentResponse);
  rpc AbortMultipartUpload (AbortMultipartUploadRequest) returns (google.protobuf.Empty);

  rpc GetAttachment (GetAttachmentRequest) returns (AttachmentResponse);
  rpc GetDownloadUrl (GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
  rpc DeleteAttachment (DeleteAttachmentRequest) returns (google.protobuf.Empty);
}

enum AttachmentStatus {
  ATTACHMENT_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  UPLOADED = 2;
  FAILED = 3;
  DELETED = 4;
}

message InitiateUploadRequest {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
}

message InitiateUploadResponse {
  string attachment_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ConfirmUploadRequest {
  string attachment_id = 1;
}

message InitiateMultipartUploadRequest {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  int32 part_count = 4;
}

message InitiateMultipartUploadResponse {
  string attachment_id = 1;
  string multipart_upload_id = 2;
  repeated MultipartPartUrl part_urls = 3;
}

message MultipartPartUrl {
  int32 part_number = 1;
  string url = 2;
}

message GetMultipartPartUrlsRequest {
  string attachment_id = 1;
  repeated int32 part_numbers = 2;
}

message GetMultipartPartUrlsResponse {
  repeated MultipartPartUrl part_urls = 1;
}

message CompleteMultipartUploadRequest {
  string attachment_id = 1;
  repeated CompletedPart parts = 2;
}

message CompletedPart {
  int32 part_number = 1;
  string etag = 2;
}

message AbortMultipartUploadRequest {
  string attachment_id = 1;
}

message GetAttachmentRequest {
  string attachment_id = 1;
}

message GetDownloadUrlRequest {
  string attachment_id = 1;
}

message GetDownloadUrlResponse {
  string download_url = 1;
}

message DeleteAttachmentRequest {
  string attachment_id = 1;
}

message AttachmentResponse {
  string id = 1;
  string uploader_id = 2;
  string file_name = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  AttachmentStatus status = 6;
  bool is_multipart = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
